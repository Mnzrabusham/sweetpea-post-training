# Direct Preference Optimization (DPO) Recipe: Qwen2.5-Coder-1.5B on SweetPea DSL
model:
  name_or_path: "Qwen/Qwen2.5-Coder-1.5B-Instruct"
  torch_dtype: "bfloat16"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

dpo:
  beta: 0.1
  loss_type: "sigmoid"
  max_length: 1024
  max_prompt_length: 512

data:
  train_file: "data/dpo_train.jsonl"
  val_file: "data/dpo_val.jsonl"

training:
  output_dir: "checkpoints/dpo_qwen_1.5b"
  num_train_epochs: 2
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4 # Effective batch size = 8
  learning_rate: 5.0e-5
  lr_scheduler_type: "cosine"
  warmup_steps: 10
  weight_decay: 0.01
  logging_steps: 5
  eval_strategy: "steps"
  eval_steps: 20
  save_strategy: "steps"
  save_steps: 20
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  bf16: true
  fp16: false
  seed: 42
  report_to: "none"
